[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "representation-kv"
version = "0.1.0"
description = "Representation-change-guided Qwen KV cache retention on LongBench"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.5,<2.7",
  "transformers==4.57.1",
  "datasets>=3.0,<5",
  "accelerate>=1.0,<2",
  "rouge>=1.0.1,<2",
  "jieba>=0.42,<1",
  "fuzzywuzzy>=0.18,<1",
  "nltk>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["representation_kv*"]
